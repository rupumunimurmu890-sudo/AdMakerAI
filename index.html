<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdMakerAI - AI Advertisement Maker</title>
  <meta property="og:title" content="AdMakerAI - AI Advertisement Maker">
<meta property="og:description" content="Create beautiful product advertisements with AdMakerAI.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AdMakerAI - Made by Santosh Marandi">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AdMakerAI - AI Advertisement Maker">
<meta name="twitter:description" content="Create beautiful product advertisements with AdMakerAI.">

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background:
    radial-gradient(circle at 10% 20%, rgba(100, 40, 255, .35), transparent 30%),
    radial-gradient(circle at 90% 10%, rgba(0, 100, 255, .30), transparent 30%),
    linear-gradient(135deg, #050018, #10002f 45%, #030b2e);
  color: #fff;
  padding: 20px;
  min-height: 100vh;
}

.app {
  max-width: 650px;
  margin: auto;
  padding: 28px;
  border-radius: 28px;
  background: rgba(10, 5, 45, .88);
  border: 1px solid rgba(168, 72, 255, .75);
  box-shadow:
    0 0 25px rgba(119, 35, 255, .35),
    0 20px 60px rgba(0, 0, 0, .5);
}

h1 {
  text-align: center;
  font-size: 38px;
  margin-bottom: 5px;
  background: linear-gradient(90deg, #fff, #b66cff, #6f8cff);
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  text-align: center;
  color: #d5c9ff;
  font-size: 17px;
  margin-bottom: 28px;
}

label {
  display: block;
  font-weight: bold;
  margin: 20px 0 9px;
  color: #fff;
  font-size: 16px;
}

input,
textarea,
select {
  width: 100%;
  padding: 15px;
  border: 1px solid #6544a8;
  border-radius: 13px;
  font-size: 16px;
  color: white;
  background: rgba(18, 10, 65, .9);
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #b45cff;
  box-shadow: 0 0 12px rgba(180, 92, 255, .35);
}

input::placeholder,
textarea::placeholder {
  color: #aaa0c5;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.upload {
  min-height: 150px;
  padding: 45px 20px;
  text-align: center;
  border: 2px dashed #a34cff;
  border-radius: 18px;
  cursor: pointer;
  color: #e5d8ff;
  background: rgba(83, 32, 160, .16);
  transition: .2s;
}

.upload:hover {
  background: rgba(120, 50, 220, .25);
  box-shadow: 0 0 20px rgba(157, 65, 255, .3);
}

.preview {
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 16px;
  border: 1px solid #7d4dff;
  background: #08021f;
  display: none;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(90deg, #7b16ff, #b42cff, #603cff);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 7px 20px rgba(112, 36, 255, .35);
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(151, 50, 255, .5);
}

button:active {
  transform: scale(.98);
}

#orderButton {
  background: linear-gradient(90deg, #00a86b, #16c784);
}

.result {
  margin-top: 28px;
  padding: 20px;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(165, 82, 255, .5);
  border-radius: 18px;
  display: none;
}

.result h2 {
  margin-bottom: 15px;
  color: #d9b6ff;
}

.script {
  line-height: 1.7;
  white-space: pre-line;
  padding: 16px;
  border-radius: 12px;
  background: rgba(0, 0, 0, .25);
}

#shareButtons {
  margin-top: 15px;
}

#shareButtons button {
  margin-top: 10px;
}

#shareButtons button:nth-child(1) {
  background: #16a05d;
}

#shareButtons button:nth-child(2) {
  background: #1877f2;
}

#shareButtons button:nth-child(3) {
  background: #229ed9;
}

#shareButtons button:nth-child(4) {
  background: #bd1e59;
}

#shareButtons button:nth-child(5) {
  background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
}

canvas {
  max-width: 100%;
  border-radius: 15px;
  margin-top: 15px;
}

body > p {
  color: #c9b9e8 !important;
}

@media (max-width: 600px) {

  body {
    padding: 10px;
  }

  .app {
    padding: 18px;
    border-radius: 20px;
  }

  h1 {
    font-size: 32px;
  }

  .upload {
    min-height: 130px;
    padding: 38px 15px;
  }

  input,
  textarea,
  select {
    font-size: 15px;
  }

  button {
    font-size: 16px;
  }
}
</style>
</head>

<body>

  <div class="app">

    <h1>🎬 AdMakerAI</h1>
    <p class="subtitle">AI Advertisement Maker</p>

    <label>📷 Product Image</label>

    <div class="upload" onclick="document.getElementById('imageInput').click()">
      Tap to upload product image
    </div>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      style="display:none"
    >

    <img id="preview" class="preview">

    <label>🛍️ Product Name</label>
    <input
      type="text"
      id="productName"
      placeholder="Example: Britannia Winkin Cow Lassi"
    >

    <label>💰 Price</label>
    <input
      type="text"
      id="price"
      placeholder="Example: ₹20"
    >

    <label>📝 Product Details</label>
    <textarea
      id="details"
      placeholder="Product ke baare mein short details likhiye..."
    ></textarea>
    <label>🔗 Affiliate / Reselling / Product Link</label>

<input
  type="url"
  id="productLink"
  placeholder="https://example.com/product-link"
>

<button id="orderButton" style="display:none;" type="button">
  🛒 Order Now
</button>

    <label>🎯 Advertisement Language</label>

    <select id="language">
      <option>Hindi</option>
      <option>English</option>
      <option>Hinglish</option>
    </select>

    <button onclick="generateAd()">
      ✨ Generate Advertisement
    </button>

    <div id="result" class="result">
  <h2>🎬 Advertisement Script</h2>
  <div id="script" class="script"></div>

  <button onclick="copyAdvertisement()">
    📋 Copy Advertisement
  </button>
      <button onclick="createAdImage()">
  🖼️ Create Advertisement Image
</button>

<canvas id="adCanvas" style="display:none;"></canvas>

<button id="downloadAd" style="display:none;" onclick="downloadAdImage()">
  📥 Download Advertisement
</button>
      <button id="shareAdImage" style="display:none;" onclick="shareAdImage()">
  📤 Share Advertisement Image
</button>
      <div id="shareButtons">

  <button type="button" onclick="shareWhatsApp()">
    🟢 Share on WhatsApp
  </button>

  <button type="button" onclick="shareFacebook()">
    🔵 Share on Facebook
  </button>

  <button type="button" onclick="shareTelegram()">
    🔷 Share on Telegram
  </button>

  <button type="button" onclick="sharePinterest()">
    📌 Share on Pinterest
  </button>

  <button type="button" onclick="shareInstagram()">
    📸 Share on Instagram
  </button>

      </div>
    </div>

  </div>
  <p style="text-align:center; margin-top:20px; color:#666; font-size:14px;">
  🎬 AdMakerAI<br>
  Made by Santosh Marandi
</p>

  
<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function () {
  const file = this.files[0];

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});


function generateAd() {

  const product = document.getElementById("productName").value.trim();
  const price = document.getElementById("price").value.trim();
  const details = document.getElementById("details").value.trim();
  const language = document.getElementById("language").value;
  const productLink = document.getElementById("productLink").value.trim();

  if (!product) {
    alert("Please enter product name.");
    return;
  }

  let script = "";

  if (language === "Hindi") {

    script =
`🎬 AdMakerAI Advertisement

✨ पेश है ${product}!

${details || "बेहतरीन क्वालिटी और शानदार अनुभव के साथ।"}

💰 कीमत: ${price || "आज की खास कीमत"}

🛒 अभी Order करें!

✨ Made by Santosh Marandi`;

  } else if (language === "English") {

    script =
`🎬 AdMakerAI Advertisement

✨ Introducing ${product}!

${details || "Great quality and an amazing experience."}

💰 Price: ${price || "Special Price"}

🛒 Order Now!

✨ Made by Santosh Marandi`;

  } else {

    script =
`🎬 AdMakerAI Advertisement

✨ Presenting ${product}!

${details || "Great quality aur amazing experience."}

💰 Price: ${price || "Special Price"}

🛒 Abhi Order karein!

✨ Made by Santosh Marandi`;

  }


  if (productLink) {
    script += `

🔗 Order Link:
${productLink}`;
  }


  document.getElementById("script").textContent = script;
  document.getElementById("result").style.display = "block";
  document.getElementById("shareButtons").style.display = "block";


  const orderButton = document.getElementById("orderButton");

  if (productLink) {

    orderButton.style.display = "block";

    orderButton.onclick = function () {
      window.open(productLink, "_blank");
    };

  } else {

    orderButton.style.display = "none";

  }

}


function copyAdvertisement() {

  const text = document.getElementById("script").textContent;

  navigator.clipboard.writeText(text).then(function () {

    alert("✅ Advertisement copied!");

  }).catch(function () {

    alert("❌ Copy नहीं हो पाया।");

  });

}



function createAdImage() {

  const product = document.getElementById("productName").value.trim();
  const price = document.getElementById("price").value.trim();
  const details = document.getElementById("details").value.trim();

  if (!product) {
    alert("Please enter product name.");
    return;
  }

  const canvas = document.getElementById("adCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 1080;
  canvas.height = 1080;

  const backgroundFile =
    document.getElementById("backgroundInput").files[0];

  const productFile =
    document.getElementById("imageInput").files[0];


  function drawProduct() {

    if (productFile) {

      const img = new Image();

      img.onload = function () {

        const maxWidth = 800;
        const maxHeight = 520;

        let width = img.width;
        let height = img.height;

        const ratio = Math.min(
          maxWidth / width,
          maxHeight / height
        );

        width *= ratio;
        height *= ratio;

        ctx.drawImage(
          img,
          (1080 - width) / 2,
          240,
          width,
          height
        );

        finishAdImage(ctx, product, price, details);

      };

      img.src = URL.createObjectURL(productFile);

    } else {

      finishAdImage(ctx, product, price, details);

    }
  }


  if (backgroundFile) {

    const bgImg = new Image();

    bgImg.onload = function () {

      ctx.drawImage(
        bgImg,
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawProduct();

    };

    bgImg.src = URL.createObjectURL(backgroundFile);

  } else {

    ctx.fillStyle = "#f5f5f5";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawProduct();

  }

}

function finishAdImage(ctx, product, price, details) {

  ctx.textAlign = "center";

  ctx.fillStyle = "#111111";
  ctx.font = "bold 45px Arial";

  ctx.fillText(
    details || "बेहतरीन क्वालिटी और शानदार अनुभव",
    540,
    830
  );

  ctx.font = "bold 60px Arial";

  ctx.fillText(
    "💰 " + (price || "Special Price"),
    540,
    920
  );

  ctx.font = "bold 45px Arial";

  ctx.fillText(
    "🛒 अभी Order करें!",
    540,
    990
  );

  ctx.font = "bold 32px Arial";

  ctx.fillText(
    "Made by Santosh Marandi",
    540,
    1040
  );

  document.getElementById("downloadAd").style.display = "block";
  document.getElementById("shareAdImage").style.display = "block";

  alert("✅ Advertisement Image तैयार है!");

}
  async function shareAdImage() {

  const canvas = document.getElementById("adCanvas");

  if (!canvas || canvas.width === 0) {
    alert("पहले Advertisement Image बनाइए।");
    return;
  }

  try {

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/png")
    );

    if (!blob) {
      alert("Image तैयार नहीं हो पाई।");
      return;
    }

    const file = new File(
      [blob],
      "AdMakerAI-Advertisement.png",
      { type: "image/png" }
    );

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        title: "AdMakerAI - AI Advertisement Maker",
        text: "Created with AdMakerAI",
        files: [file]
      });

    } else {

      alert(
        "आपके browser में image sharing supported नहीं है। पहले Download Advertisement करें।"
      );

    }

  } catch (error) {

    if (error.name !== "AbortError") {
      alert("Image share नहीं हो पाई।");
    }

  }

  }


function downloadAdImage() {

  const canvas = document.getElementById("adCanvas");

  const link = document.createElement("a");

  link.download = "AdMakerAI-Advertisement.png";

  link.href = canvas.toDataURL("image/png");

  link.click();

}


function shareWhatsApp() {

  const text = document.getElementById("script").textContent;

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(text),
    "_blank"
  );

}


function shareFacebook() {

  const url = window.location.href;

  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(url),
    "_blank"
  );

}


function shareTelegram() {

  const text = document.getElementById("script").textContent;
  const url = window.location.href;

  window.open(
    "https://t.me/share/url?url=" +
    encodeURIComponent(url) +
    "&text=" +
    encodeURIComponent(text),
    "_blank"
  );

}


function sharePinterest() {

  const url = window.location.href;

  window.open(
    "https://www.pinterest.com/pin/create/button/?url=" +
    encodeURIComponent(url),
    "_blank"
  );

}


function shareInstagram() {

  const text = document.getElementById("script").textContent;

  navigator.clipboard.writeText(text).then(function() {

    alert(
      "✅ Advertisement copied! अब Instagram खोलें और पोस्ट/स्टोरी में इसे इस्तेमाल करें।"
    );

    window.open("https://www.instagram.com/", "_blank");

  }).catch(function() {

    window.open("https://www.instagram.com/", "_blank");

  });

}

</script>
</body>
</html>
