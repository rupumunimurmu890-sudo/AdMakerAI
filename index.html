<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdMakerAI - AI Advertisement Maker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7ff;
      color: #172033;
      padding: 20px;
    }

    .app {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .upload {
      border: 2px dashed #777;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
    }

    .preview {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 12px;
      display: none;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #5b35f5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      background: #f5f5f5;
      border-radius: 12px;
      display: none;
    }

    .result h2 {
      margin-bottom: 12px;
    }

    .script {
      line-height: 1.6;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🎬 AdMakerAI</h1>
    <p class="subtitle">AI Advertisement Maker</p>

    <label>📷 Product Image</label>

    <div class="upload" onclick="document.getElementById('imageInput').click()">
      Tap to upload product image
    </div>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      style="display:none"
    >

    <img id="preview" class="preview">

    <label>🛍️ Product Name</label>
    <input
      type="text"
      id="productName"
      placeholder="Example: Britannia Winkin Cow Lassi"
    >

    <label>💰 Price</label>
    <input
      type="text"
      id="price"
      placeholder="Example: ₹20"
    >

    <label>📝 Product Details</label>
    <textarea
      id="details"
      placeholder="Product ke baare mein short details likhiye..."
    ></textarea>
    <label>🔗 Affiliate / Reselling / Product Link</label>

<input
  type="url"
  id="productLink"
  placeholder="https://example.com/product-link"
>

<button id="orderButton" style="display:none;" type="button">
  🛒 Order Now
</button>

    <label>🎯 Advertisement Language</label>

    <select id="language">
      <option>Hindi</option>
      <option>English</option>
      <option>Hinglish</option>
    </select>

    <button onclick="generateAd()">
      ✨ Generate Advertisement
    </button>

    <div id="result" class="result">
  <h2>🎬 Advertisement Script</h2>
  <div id="script" class="script"></div>

  <button onclick="copyAdvertisement()">
    📋 Copy Advertisement
  </button>
      <button onclick="createAdImage()">
  🖼️ Create Advertisement Image
</button>

<canvas id="adCanvas" style="display:none;"></canvas>

<button id="downloadAd" style="display:none;" onclick="downloadAdImage()">
  📥 Download Advertisement
</button>
    </div>

  </div>

  <script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }

});

function generateAd() {

  const product =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const details =
    document.getElementById("details").value.trim();

  const language =
    document.getElementById("language").value;

  if (!product) {
    alert("Please enter product name.");
    return;
  }

  let script = "";

  if (language === "Hindi") {

    script =
`🎬 AdMakerAI Advertisement

✨ पेश है ${product}!

${details || "बेहतरीन क्वालिटी और शानदार अनुभव के साथ।"}

💰 कीमत: ${price || "आज की खास कीमत"}

🛒 अभी Order करें!

❤️ HomeCart Shopping`;

  } else if (language === "English") {

    script =
`🎬 AdMakerAI Advertisement

✨ Introducing ${product}!

${details || "Great quality and an amazing experience."}

💰 Price: ${price || "Special Price"}

🛒 Order Now!

❤️ HomeCart Shopping`;

  } else {

    script =
`🎬 AdMakerAI Advertisement

✨ Presenting ${product}!

${details || "Great quality aur amazing experience."}

💰 Price: ${price || "Special Price"}

🛒 Abhi Order karein!

❤️ HomeCart Shopping`;

  }

  document.getElementById("script").textContent = script;

  document.getElementById("result").style.display = "block";

}

function copyAdvertisement() {

  const text = document.getElementById("script").textContent;

  navigator.clipboard.writeText(text).then(function() {

    alert("✅ Advertisement copied!");

  }).catch(function() {

    alert("❌ Copy नहीं हो पाया।");

  });

}
    function createAdImage() {

  const product = document.getElementById("productName").value.trim();
  const price = document.getElementById("price").value.trim();
  const details = document.getElementById("details").value.trim();

  if (!product) {
    alert("Please enter product name.");
    return;
  }

  const canvas = document.getElementById("adCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 1080;
  canvas.height = 1080;

  // Background
  ctx.fillStyle = "#f5f5f5";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Header
  ctx.fillStyle = "#111111";
  ctx.font = "bold 70px Arial";
  ctx.textAlign = "center";
  ctx.fillText("🎬 AdMakerAI", 540, 100);

  // Product name
  ctx.font = "bold 55px Arial";
  ctx.fillText(product, 540, 190);

  // Product image
  const file = document.getElementById("imageInput").files[0];

  if (file) {

    const img = new Image();

    img.onload = function () {

      const maxWidth = 800;
      const maxHeight = 520;

      let width = img.width;
      let height = img.height;

      const ratio = Math.min(maxWidth / width, maxHeight / height);

      width *= ratio;
      height *= ratio;

      ctx.drawImage(
        img,
        (1080 - width) / 2,
        240,
        width,
        height
      );

      finishAdImage(ctx, canvas, product, price, details);

    };

    img.src = URL.createObjectURL(file);

  } else {

    finishAdImage(ctx, canvas, product, price, details);

  }
}


function finishAdImage(ctx, canvas, product, price, details) {

  ctx.textAlign = "center";

  ctx.fillStyle = "#111111";
  ctx.font = "bold 45px Arial";
  ctx.fillText(
    details || "बेहतरीन क्वालिटी और शानदार अनुभव",
    540,
    830
  );

  ctx.fillStyle = "#111111";
  ctx.font = "bold 60px Arial";
  ctx.fillText(
    "💰 " + (price || "Special Price"),
    540,
    920
  );

  ctx.font = "bold 45px Arial";
  ctx.fillText("🛒 अभी Order करें!", 540, 990);

  document.getElementById("downloadAd").style.display = "block";

  alert("✅ Advertisement Image तैयार है!");
}


function downloadAdImage() {

  const canvas = document.getElementById("adCanvas");

  const link = document.createElement("a");

  link.download = "AdMakerAI-Advertisement.png";

  link.href = canvas.toDataURL("image/png");

  link.click();

}

  </script>

</body>
</html>
