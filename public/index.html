<body>

  <div class="app">

    <h1>🎬 AdMakerAI</h1>
    <p class="subtitle">AI Advertisement Maker</p>

    <div class="topBar">
      <button type="button" id="themeToggle" onclick="toggleTheme()">
        🌙 Dark Mode
      </button>
      <button type="button" onclick="toggleHistoryPanel()">
        📜 History

    </div>

    <div id="historyPanel">

      <button type="button" onclick="clearHistory()" style="background:#a52a4a; margin-top:15px;">
        🗑️ Clear History

    </div>

    <form id="adForm">

      <div class="upload" onclick="document.getElementById('imageInput').click()">

        id="imageInput"
        accept="image/*"
        style="display:none"
      >

        id="productName"

      >

      <label>💰 Price</label>
      <input
        type="text"
        id="price"
        placeholder="Example: ₹20"
      >

      <label>📝 Product Details</label>
      <textarea
        id="details"
        placeholder="Product ke baare mein short details likhiye..."
      ></textarea>

      <label>🔗 Affiliate / Reselling / Product Link</label>

      <input
        type="url"
        id="productLink"
        placeholder="https://example.com/product-link"
      >

      <label>🎨 Advertisement Style</label>

      <select id="adStyle">
        <option value="Professional and attractive">Professional</option>
        <option value="Fun and casual">Fun &amp; Casual</option>
        <option value="Luxury and premium">Luxury / Premium</option>
        <option value="Minimal and clean">Minimal</option>
        <option value="Bold and energetic">Bold &amp; Energetic</option>
      </select>

      <label>🎉 Occasion / Template</label>

      <select id="adTemplate">
        <option value="none">None</option>
        <option value="Diwali sale">🪔 Diwali Sale</option>
        <option value="Flash sale with urgency and limited time">⚡ Flash Sale</option>
        <option value="New product launch">🚀 New Launch</option>
        <option value="Republic Day patriotic sale">🇮🇳 Republic Day Sale</option>
        <option value="Wedding season special">💍 Wedding Special</option>
        <option value="Summer season offer">☀️ Summer Sale</option>
        <option value="Eid special offer">🌙 Eid Special</option>
        <option value="Year end clearance sale">🎊 Year End Sale</option>
      </select>

      <label>🎯 Advertisement Language</label>

      <select id="language">
        <option value="Hindi">Hindi (हिन्दी)</option>
        <option value="English">English</option>
        <option value="Hinglish">Hinglish</option>

        <option value="Bengali">Bengali (বাংলা)</option>
        <option value="Santali">Santali (ᱥᱟᱱᱛᱟᱲᱤ)</option>
        <option value="Marathi">Marathi (मराठी)</option>
        <option value="Gujarati">Gujarati (ગુજરાતી)</option>
        <option value="Punjabi">Punjabi (ਪੰਜਾਬੀ)</option>
        <option value="Tamil">Tamil (தமிழ்)</option>
        <option value="Telugu">Telugu (తెలుగు)</option>
        <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
        <option value="Malayalam">Malayalam (മലയാളം)</option>
        <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
        <option value="Assamese">Assamese (অসমীয়া)</option>
        <option value="Urdu">Urdu (اردو)</option>

        <option value="Nepali">Nepali (नेपाली)</option>
        <option value="Maithili">Maithili (मैथिली)</option>
        <option value="Kashmiri">Kashmiri (कॉशुर)</option>

        <option value="Sindhi">Sindhi (सिन्धी)</option>
        <option value="Sanskrit">Sanskrit (संस्कृतम्)</option>

        <option value="German">German (Deutsch)</option>
        <option value="Portuguese">Portuguese (Português)</option>
        <option value="Italian">Italian (Italiano)</option>
        <option value="Arabic">Arabic (العربية)</option>

        <option value="Turkish">Turkish (Türkçe)</option>
        <option value="Russian">Russian (Русский)</option>
        <option value="Japanese">Japanese (日本語)</option>

          🔷 Share on Telegram
        </button>

<p style="text-align:center; margin-top:20px; color:#666; font-size:14px;">
  🎬 AdMakerAI<br>
  © 2026 Santosh Marandi
</p>


<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function () {
  const file = this.files[0];

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});


// ========================================
// 🆕 AFFILIATE LINK HELPERS
// ========================================

function copyAffiliateLink() {

  const link =
    document.getElementById("productLink")?.value.trim() || "";

  if (!link) {
    alert("पहले Affiliate / Product Link डालें।");
    return;
  }

  navigator.clipboard.writeText(link).then(function () {

    alert("✅ Affiliate link copied!");

  }).catch(function () {

    alert("❌ Link copy नहीं हो पाया।");

  });
}


function buyNow() {

  const link =
    document.getElementById("productLink")?.value.trim() || "";

  if (!link) {
    alert("पहले Affiliate / Product Link डालें।");
    return;
  }

  window.open(link, "_blank");
}


// ========================================
// 📤 SHARE ADVERTISEMENT (image + text)
// Uses whichever advertisement image app.js
// most recently generated (#generatedAdImage).
// Falls back to text-only share if no image
// has been generated yet.
// ========================================

async function shareAdvertisement() {

  const scriptElement = document.getElementById("script");

  let text = scriptElement
    ? scriptElement.textContent.trim()
    : "AdMakerAI Advertisement";

  // 🆕 Affiliate link ko share text ke sath jodo
  // (image/video ke andar clickable link embed nahi ho sakta,
  // isliye link text ke sath jaana zaroori hai)
  const productLink =
    document.getElementById("productLink")?.value.trim() || "";

  if (productLink) {
    text += "\n\n🛒 Buy Now: " + productLink;
  }

  const imgElement = document.getElementById("generatedAdImage");

  try {

    let file = null;

    if (imgElement && imgElement.src) {

      const imgResponse = await fetch(imgElement.src);
      const blob = await imgResponse.blob();

      file = new File(
        [blob],
        "AdMakerAI-Advertisement.jpg",
        { type: blob.type || "image/jpeg" }
      );
    }

    if (
      file &&
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        title: "AdMakerAI Advertisement",
        text: text,
        files: [file]
      });

      return;
    }

    if (navigator.share) {

      await navigator.share({
        title: "AdMakerAI Advertisement",
        text: text
      });

      return;
    }

    alert(
      "इस browser में sharing उपलब्ध नहीं है। Android Chrome में खोलें।"
    );

  } catch (error) {

    if (error.name !== "AbortError") {

      console.error("Advertisement Share Error:", error);

      alert("❌ Advertisement share नहीं हो पाई।");
    }
  }
}


// ========================================
// 📱 SOCIAL MEDIA SHARE
// ========================================

function shareWhatsApp() {
  shareAdvertisement();
}

function shareFacebook() {
  shareAdvertisement();
}

function shareTelegram() {
  shareAdvertisement();
}

function sharePinterest() {
  shareAdvertisement();
}

function shareInstagram() {
  shareAdvertisement();
}

</script>
